<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
{% block body %}
<header class="topbar">
  <a class="brand" href="{{ url_for('admin.dashboard') }}"><span class="brand-mark">✦</span> {{ app_name }}</a>
  <nav class="topnav">
    <a href="{{ url_for('admin.dashboard') }}">Invitations</a>
    <a href="{{ url_for('admin.system') }}">System</a>
    <a href="{{ url_for('admin.account') }}">{{ current_user.name }}</a>
    <form method="post" action="{{ url_for('auth.logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="link" type="submit">Sign out</button>
    </form>
  </nav>
</header>
<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
{% endblock %}
<script src="{{ url_for('static', filename='js/admin.js') }}" defer></script>
</body>
</html>
